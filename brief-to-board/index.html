<script>
(() => {

// ---------- constants ----------
const OBJECTIVES = ["Conversions / sales", "App installs", "Lead generation", "Trial sign-ups", "Retargeting", "Awareness / reach", "Engagement"];

  title: "Example: New Year 3-month membership push",
  product: "3-month gym + group-class membership, 25% off launch price",
  objective: "Conversions / sales",
  audience: "25–40 working professionals in metro cities who lapsed on fitness last year; motivated but short on time",
  market: "ALL",
  platforms: ["Meta feed", "Stories / Reels", "Instagram feed"],
  formats: ["4:5", "9:16"],
  message: "Restart without the pressure: classes that fit before or after work",
  cta: "Join now",
  mandatories: "Show offer % and price; logo top-left; no before/after body shots; T&C line",
  mood: "energetic, warm, real people, morning light, community",
  competitors: "boutique studios, big-box gym chains, home-workout apps",
  references: "",
  kpi: "CPA under target, CTR > 1.2%",
  due: ""

// ---------- state ----------
const S = {
  db: null, user: null, sample: null, assets: null, downloads: null,
  me: null, canEdit: false, canWrite: true, limits: null,
  guide: null, briefs: [], refs: [], loaded: { briefs: false, refs: false, guide: false },
  view: "home", tab: "brief", renderedKey: "",
  busy: {}, ctl: {}, err: {}, progress: {},
  upload: { source: "pinterest", link: "", note: "", queue: 0 },

// ---------- helpers ----------

const isHex = (s) => /^#[0-9a-f]{6}$/i.test(str(s).trim());

let toastT;
function toast(msg) { document.querySelector(".toast")?.remove(); const t = h("div", { class: "toast", role: "status" }, msg); document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200); }
function sampleErr(e) {
  const c = e?.code;

  if (c === "rate_limited") return e.reason === "usage_limit" ? "You've reached your Claude usage limit. Try again later." : "Too many requests at once. Wait a minute and try again.";
  if (c === "invalid_json") return "Claude's answer came back in the wrong shape. Try again.";
  if (c === "image_rejected") return "One of the images couldn't be read. Remove it or try a different file.";
  if (c === "images_unavailable") return "This view can't send images to Claude. Open the page on claude.ai in a browser.";
  if (c === "refused") return "Claude declined this request. Rephrase the brief and try again.";
  if (c === "prompt_too_large") return "Too much text for one request. Shorten the brief or guideline.";

// ---------- colour science ----------
function hexToRgb(hx) { const n = parseInt(hx.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

const dE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

}
function paletteFit(colors) {
  const pal = arr(S.guide?.palette).map(p => p.hex).filter(isHex);
  if (!pal.length || !arr(colors).length) return null;
  const labs = pal.map(hx => rgbToLab(hexToRgb(hx)));

  const max = 1600, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));

  return { blob, colors, w: c.width, h: c.height };
}
