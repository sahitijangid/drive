<style>

  --accent: #93A2FF; --accent-ink: #0C1033; --accent-soft: #232A4E;
  --ok: #62C793; --ok-soft: #173326; --warn: #E2B04F; --warn-soft: #3A2E14; --bad: #F08A80; --bad-soft: #3D1D1A;
  --pin: #FF7486; --meta: #79AEFF; --ig: #F282BF; --other: #98A199; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111412; --surface: #1A1E1B; --sunk: #151816; --ink: #E8EBE6; --muted: #98A199; --line: #2C332E;
  --accent: #93A2FF; --accent-ink: #0C1033; --accent-soft: #232A4E;
  --ok: #62C793; --ok-soft: #173326; --warn: #E2B04F; --warn-soft: #3A2E14; --bad: #F08A80; --bad-soft: #3D1D1A;
  --pin: #FF7486; --meta: #79AEFF; --ig: #F282BF; --other: #98A199; color-scheme: dark }

* { box-sizing: border-box; }

.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; background: var(--sunk); cursor: pointer; }

@media (max-width: 860px) {

}

// ---------- helpers ----------

// ---------- colour science ----------

async function prepImage(file) {

  const max = 1600, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);

  const blob = await new Promise((res, rej) => c.toBlob(bl => bl ? res(bl) : rej(new Error("encode")), "image/jpeg", 0.88));

$("newBriefBtn").addEventListener("click", () => go("new"));
$("guideNav").addEventListener("click", () => go("guide"));
$("importNav").addEventListener("click", () => go("import"));
$("libNav").addEventListener("click", () => go("library"));
$("briefSearch").addEventListener("input", renderSide);
$("briefCat").addEventListener("change", renderSide);
readHash(); render(true);

(async () => {
  const c = window.claude;
  if (!c?.use) { S.dbChecked = true; S.capsChecked = true; S.loaded.guide = true; render(true); return; }
  const [db, user, sample, assets, downloads, mcp] = await Promise.all(["db", "user", "sample", "assets", "downloads", "mcp"].map(n => c.use(n).catch(() => null)));
  Object.assign(S, { db, user, sample, assets, downloads, mcp, dbChecked: true, capsChecked: true });
  if (user) { try { S.me = await user.me(); } catch {} try { S.canEdit = !!(await user.canEdit()); } catch {} }
  if (sample) { try { S.limits = await sample.limits(); } catch {} }
  if (!db) { S.loaded.guide = true; render(true); return; }
  const timer = setTimeout(() => { if (!S.loaded.briefs) { S.loaded.briefs = true; S.loaded.guide = true; render(true); } }, 10000);
  db.collection("curated").orderBy("order", "asc").limit(1000).onSnapshot(s => { S.curated = s.docs.map(d => ({ id: d.id, ...d.data() })); S.curatedErr = ""; render(); }, () => { S.curatedErr = "Claude's picks couldn't load. Reload the page to try again."; render(); });
  if (S.me?.id) db.collection("data/users/" + S.me.id).limit(1000).onSnapshot(s => {
    const r = {}; let taste = null;
    for (const d of s.docs) { const x = d.data(); if (d.id === "taste") taste = x; else if (d.id.startsWith("r_") && (x.rating === "like" || x.rating === "pass")) r[d.id.slice(2)] = x.rating; }
    S.ratings = r; S.taste = taste; render();
  }, () => {});
  db.doc("brand/import").onSnapshot(s => { S.importCfg = s.exists ? s.data() : null; render(); }, () => {});
  db.doc("brand/thematics").onSnapshot(s => { S.thematics = s.exists ? (s.data().items || {}) : {}; }, () => {});
  db.doc("brand/guide").onSnapshot(s => { S.guide = s.exists ? s.data() : null; S.loaded.guide = true; render(); }, () => { S.loaded.guide = true; render(); });
  db.collection("briefs").orderBy("createdAt", "desc").limit(200).onSnapshot(s => { clearTimeout(timer); S.briefs = s.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.briefs = true; render(); }, () => { S.loaded.briefs = true; render(); });
  db.collection("refs").orderBy("createdAt", "desc").limit(1000).onSnapshot(s => { S.refs = s.docs.map(d => ({ id: d.id, ...d.data() })); S.loaded.refs = true; render(); }, () => { S.loaded.refs = true; render(); });
})();
})();
</script>
